<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Node Box Gradients -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="activeNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#131C2E"/>
    </linearGradient>

    <!-- Flow Line Gradients -->
    <linearGradient id="flowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="flowEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FBBF24"/>
    </marker>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes dashFlow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.03); }
    }

    @keyframes particleMove1 {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }

    @keyframes badgePulse {
      0%, 100% { fill-opacity: 0.15; stroke-opacity: 0.4; }
      50% { fill-opacity: 0.35; stroke-opacity: 0.9; }
    }

    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashFlow 1.4s linear infinite;
    }

    .flow-line-fast {
      stroke-dasharray: 6 5;
      animation: dashFlow 0.9s linear infinite;
    }

    .node-card {
      transition: all 0.3s ease;
    }

    .node-badge {
      animation: badgePulse 2s ease-in-out infinite;
    }

    .seq-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
    }
  </style>

  <!-- Canvas Background with Grid -->
  <rect width="920" height="440" rx="16" fill="url(#bgGlow)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Background Subtle Architectural Grid Lines -->
  <g stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.4">
    <line x1="40" y1="0" x2="40" y2="440"/>
    <line x1="230" y1="0" x2="230" y2="440"/>
    <line x1="460" y1="0" x2="460" y2="440"/>
    <line x1="690" y1="0" x2="690" y2="440"/>
    <line x1="880" y1="0" x2="880" y2="440"/>
    <line x1="0" y1="70" x2="920" y2="70"/>
    <line x1="0" y1="230" x2="920" y2="230"/>
    <line x1="0" y1="380" x2="920" y2="380"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(30, 24)">
    <text x="0" y="20" fill="#F8FAFC" font-size="18" class="seq-text" letter-spacing="0.5">Ivy Homes System Architecture & Sequential Request Flow</text>
    <text x="0" y="38" fill="#94A3B8" font-size="12" font-family="'Segoe UI', sans-serif">End-to-End Execution Sequence: Client UI → Resilience Layer → Normalization Engine → API Gateway → Analytics</text>
  </g>

  <!-- TOP ROW NODES (Steps 1, 2, 3) -->

  <!-- STEP 1: React 18 Client App -->
  <g transform="translate(30, 95)" filter="url(#shadow)">
    <rect width="250" height="135" rx="12" fill="url(#nodeGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
    <text x="21" y="31" fill="#38BDF8" font-size="14" font-weight="bold">1</text>
    <text x="48" y="31" fill="#F8FAFC" font-size="14" class="seq-text">React 18 Frontend UI</text>
    
    <path d="M 12 48 L 238 48" stroke="#334155" stroke-width="1"/>
    
    <text x="16" y="68" fill="#94A3B8" font-size="11" font-family="sans-serif">• Vite + TailwindCSS v4 + shadcn/ui</text>
    <text x="16" y="86" fill="#94A3B8" font-size="11" font-family="sans-serif">• Listings, Rentals &amp; Projects Views</text>
    <text x="16" y="104" fill="#94A3B8" font-size="11" font-family="sans-serif">• Saved Context Sync (/v1/saved)</text>
    <text x="16" y="120" fill="#38BDF8" font-size="10" font-family="sans-serif" font-weight="bold">STATE: Optimistic UI Updates</text>
  </g>

  <!-- STEP 2: Auth & Token Resilience Layer -->
  <g transform="translate(335, 95)" filter="url(#shadow)">
    <rect width="250" height="135" rx="12" fill="url(#nodeGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#4F46E5" fill-opacity="0.2" stroke="#818CF8" stroke-width="1"/>
    <text x="21" y="31" fill="#818CF8" font-size="14" font-weight="bold">2</text>
    <text x="48" y="31" fill="#F8FAFC" font-size="14" class="seq-text">Auth &amp; Resilience Engine</text>
    
    <path d="M 12 48 L 238 48" stroke="#334155" stroke-width="1"/>
    
    <text x="16" y="68" fill="#94A3B8" font-size="11" font-family="sans-serif">• 30-Min Resilience Session Timer</text>
    <text x="16" y="86" fill="#94A3B8" font-size="11" font-family="sans-serif">• Auto Token Refresh (Every 12 min)</text>
    <text x="16" y="104" fill="#94A3B8" font-size="11" font-family="sans-serif">• Header Inject: X-API-Key &amp; Bearer</text>
    <text x="16" y="120" fill="#818CF8" font-size="10" font-family="sans-serif" font-weight="bold">SECURITY: Auto Auth Recovery</text>
  </g>

  <!-- STEP 3: Data Quality & Normalization Engine -->
  <g transform="translate(640, 95)" filter="url(#shadow)">
    <rect width="250" height="135" rx="12" fill="url(#nodeGrad)" stroke="#34D399" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#059669" fill-opacity="0.2" stroke="#34D399" stroke-width="1"/>
    <text x="21" y="31" fill="#34D399" font-size="14" font-weight="bold">3</text>
    <text x="48" y="31" fill="#F8FAFC" font-size="14" class="seq-text">Normalization &amp; Audit</text>
    
    <path d="M 12 48 L 238 48" stroke="#334155" stroke-width="1"/>
    
    <text x="16" y="68" fill="#94A3B8" font-size="11" font-family="sans-serif">• Price Normalization (Lakh/Cr → ₹)</text>
    <text x="16" y="86" fill="#94A3B8" font-size="11" font-family="sans-serif">• Saved Payload Fix ({ listing_id })</text>
    <text x="16" y="104" fill="#94A3B8" font-size="11" font-family="sans-serif">• Missing Field Sanitization</text>
    <text x="16" y="120" fill="#34D399" font-size="10" font-family="sans-serif" font-weight="bold">INTEGRITY: Clean Schema Mapping</text>
  </g>

  <!-- BOTTOM ROW NODES (Steps 4, 5) -->

  <!-- STEP 4: Ivy Homes REST API Backend -->
  <g transform="translate(640, 275)" filter="url(#shadow)">
    <rect width="250" height="130" rx="12" fill="url(#nodeGrad)" stroke="#FBBF24" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#D97706" fill-opacity="0.2" stroke="#FBBF24" stroke-width="1"/>
    <text x="21" y="31" fill="#FBBF24" font-size="14" font-weight="bold">4</text>
    <text x="48" y="31" fill="#F8FAFC" font-size="14" class="seq-text">Ivy Backend REST API</text>
    
    <path d="M 12 48 L 238 48" stroke="#334155" stroke-width="1"/>
    
    <text x="16" y="68" fill="#94A3B8" font-size="11" font-family="sans-serif">• GET /v1/listings &amp; /v1/rentals</text>
    <text x="16" y="86" fill="#94A3B8" font-size="11" font-family="sans-serif">• GET /v1/projects &amp; /v1/saved</text>
    <text x="16" y="104" fill="#94A3B8" font-size="11" font-family="sans-serif">• POST/DELETE /v1/saved Sync</text>
    <text x="16" y="118" fill="#FBBF24" font-size="10" font-family="sans-serif" font-weight="bold">API: solve.ivy.homes Gateway</text>
  </g>

  <!-- STEP 5: Analytics & Submission Engine -->
  <g transform="translate(180, 275)" filter="url(#shadow)">
    <rect width="405" height="130" rx="12" fill="url(#nodeGrad)" stroke="#A78BFA" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#7C3AED" fill-opacity="0.2" stroke="#A78BFA" stroke-width="1"/>
    <text x="21" y="31" fill="#A78BFA" font-size="14" font-weight="bold">5</text>
    <text x="48" y="31" fill="#F8FAFC" font-size="14" class="seq-text">Analytics Engine &amp; Submission Generator</text>
    
    <path d="M 12 48 L 393 48" stroke="#334155" stroke-width="1"/>
    
    <text x="16" y="68" fill="#94A3B8" font-size="11" font-family="sans-serif">• 10 Automated Data Answers for Pune (Reference: 2026-09-10T00:00:00+05:30)</text>
    <text x="16" y="86" fill="#94A3B8" font-size="11" font-family="sans-serif">• 13 Documented API Lies &amp; Evidence Audit Log Generator</text>
    <text x="16" y="104" fill="#94A3B8" font-size="11" font-family="sans-serif">• Automated Root submission.json &amp; Interactive Executive Dashboard</text>
    <text x="16" y="118" fill="#A78BFA" font-size="10" font-family="sans-serif" font-weight="bold">OUTPUT: verified submission.json + Insights Dashboard</text>
  </g>


  <!-- SEQUENTIAL ANIMATED FLOW CONNECTOR PATHS -->

  <!-- Flow 1: Step 1 -> Step 2 (Horizontal Right) -->
  <g>
    <path d="M 280 162 L 335 162" stroke="#38BDF8" stroke-width="2" class="flow-line" marker-end="url(#arrowCyan)"/>
    <rect x="288" y="146" width="38" height="14" rx="3" fill="#090D16" stroke="#38BDF8" stroke-opacity="0.4"/>
    <text x="292" y="156" fill="#38BDF8" font-size="9" class="seq-text">REQ 1</text>
  </g>

  <!-- Flow 2: Step 2 -> Step 3 (Horizontal Right) -->
  <g>
    <path d="M 585 162 L 640 162" stroke="#818CF8" stroke-width="2" class="flow-line" marker-end="url(#arrowCyan)"/>
    <rect x="593" y="146" width="38" height="14" rx="3" fill="#090D16" stroke="#818CF8" stroke-opacity="0.4"/>
    <text x="597" y="156" fill="#818CF8" font-size="9" class="seq-text">REQ 2</text>
  </g>

  <!-- Flow 3: Step 3 -> Step 4 (Vertical Down) -->
  <g>
    <path d="M 765 230 L 765 275" stroke="#34D399" stroke-width="2" class="flow-line" marker-end="url(#arrowEmerald)"/>
    <rect x="746" y="244" width="38" height="14" rx="3" fill="#090D16" stroke="#34D399" stroke-opacity="0.4"/>
    <text x="750" y="254" fill="#34D399" font-size="9" class="seq-text">REQ 3</text>
  </g>

  <!-- Flow 4: Step 4 -> Step 5 (Horizontal Left) -->
  <g>
    <path d="M 640 340 L 585 340" stroke="#FBBF24" stroke-width="2" class="flow-line-fast" marker-end="url(#arrowAmber)"/>
    <rect x="593" y="324" width="38" height="14" rx="3" fill="#090D16" stroke="#FBBF24" stroke-opacity="0.4"/>
    <text x="597" y="334" fill="#FBBF24" font-size="9" class="seq-text">DATA</text>
  </g>

  <!-- Flow 5: Step 5 -> Step 1 Loopback (Curve Up-Left to Step 1) -->
  <g>
    <path d="M 180 340 Q 105 340 105 230" stroke="#A78BFA" stroke-width="2" stroke-dasharray="6 4" class="flow-line" marker-end="url(#arrowCyan)"/>
    <rect x="80" y="275" width="50" height="14" rx="3" fill="#090D16" stroke="#A78BFA" stroke-opacity="0.4"/>
    <text x="84" y="285" fill="#A78BFA" font-size="9" class="seq-text">RENDER</text>
  </g>

</svg>
